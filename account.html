<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conta — NOIR.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(var(--nav-h) + var(--s8)) var(--pad) var(--s16);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--r5);
      padding: var(--s8);
    }
    .auth-logo {
      font-family: var(--font-display);
      font-size: 32px;
      letter-spacing: .1em;
      text-align: center;
      margin-bottom: var(--s8);
      color: var(--text);
    }
  </style>
</head>
<body>
<div id="header"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">NOIR.</div>

    <!-- Tabs -->
    <div class="tabs" id="authTabs">
      <button class="tab-btn active" data-tab="login">Entrar</button>
      <button class="tab-btn" data-tab="register">Criar Conta</button>
    </div>

    <div id="authPanels">
      <!-- Login -->
      <div class="tab-panel active" data-panel="login" style="padding-top:var(--s6)">
        <form id="loginForm">
          <div class="form-group" style="margin-bottom:var(--s4)">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" placeholder="nome@email.com" required>
          </div>
          <div class="form-group" style="margin-bottom:var(--s5)">
            <label class="form-label" style="display:flex;justify-content:space-between">
              Palavra-passe
              <a href="#" style="color:var(--accent);font-size:11px;letter-spacing:0;text-transform:none;font-weight:400">Esqueci-me</a>
            </label>
            <input type="password" class="form-input" placeholder="••••••••" required>
          </div>
          <label class="form-checkbox-wrap" style="margin-bottom:var(--s5)">
            <input type="checkbox" class="form-checkbox" checked>
            <span class="form-checkbox-label">Manter sessão iniciada</span>
          </label>
          <button type="submit" class="btn btn-primary btn-full">Entrar</button>
        </form>
        <div style="display:flex;align-items:center;gap:var(--s3);margin:var(--s5) 0">
          <div style="flex:1;height:1px;background:var(--border)"></div>
          <span style="font-size:12px;color:var(--text-4)">ou</span>
          <div style="flex:1;height:1px;background:var(--border)"></div>
        </div>
        <button class="btn btn-outline btn-full" onclick="showToast('Login social em breve!', 'default')">
          <svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continuar com Google
        </button>
      </div>

      <!-- Register -->
      <div class="tab-panel" data-panel="register" style="padding-top:var(--s6)">
        <form id="registerForm">
          <div class="form-row" style="margin-bottom:var(--s4)">
            <div class="form-group">
              <label class="form-label">Nome</label>
              <input type="text" class="form-input" placeholder="João" required>
            </div>
            <div class="form-group">
              <label class="form-label">Apelido</label>
              <input type="text" class="form-input" placeholder="Silva" required>
            </div>
          </div>
          <div class="form-group" style="margin-bottom:var(--s4)">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" placeholder="nome@email.com" required>
          </div>
          <div class="form-group" style="margin-bottom:var(--s4)">
            <label class="form-label">Palavra-passe</label>
            <input type="password" class="form-input" placeholder="Mínimo 8 caracteres" minlength="8" required>
          </div>
          <label class="form-checkbox-wrap" style="margin-bottom:var(--s5)">
            <input type="checkbox" class="form-checkbox">
            <span class="form-checkbox-label">Receber ofertas exclusivas e novidades</span>
          </label>
          <button type="submit" class="btn btn-primary btn-full">Criar Conta</button>
          <p style="font-size:11px;color:var(--text-4);margin-top:10px;text-align:center">
            Ao criar conta, aceitas os nossos <a href="#" style="color:var(--accent)">Termos</a> e <a href="#" style="color:var(--accent)">Privacidade</a>.
          </p>
        </form>
      </div>
    </div>
  </div>
</div>

<div id="footer" style="display:none"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/cart.js"></script>
<script>
document.getElementById('loginForm')?.addEventListener('submit', e => {
  e.preventDefault();
  showToast('Bem-vindo de volta!', 'success');
  setTimeout(() => window.location.href = 'index.html', 1200);
});
document.getElementById('registerForm')?.addEventListener('submit', e => {
  e.preventDefault();
  showToast('Conta criada com sucesso! Bem-vindo à NOIR.', 'success');
  setTimeout(() => window.location.href = 'index.html', 1200);
});
</script>
</body>
</html>
