<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — NOIR.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/animations.css">
  <style>
    .contact-layout {
      display: grid;
      grid-template-columns: 1fr 1.5fr;
      gap: var(--s12);
      align-items: start;
    }
    .contact-info-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--r4);
      padding: var(--s6);
    }
    .contact-channel {
      display: flex;
      align-items: center;
      gap: var(--s4);
      padding: var(--s4) 0;
      border-bottom: 1px solid var(--border);
    }
    .contact-channel:last-child { border-bottom: none; }
    .contact-channel-icon {
      width: 44px; height: 44px;
      background: var(--bg-4);
      border-radius: var(--r3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }
    @media (max-width: 900px) {
      .contact-layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="header"></div>

<div class="page-header">
  <div class="container">
    <h1 class="page-header-title">Contacto</h1>
    <p class="page-header-sub">Estamos sempre disponíveis para ajudar.</p>
  </div>
</div>

<div class="container section-sm">
  <div class="contact-layout">
    <!-- Info -->
    <div>
      <div class="contact-info-card reveal">
        <div class="label" style="margin-bottom:var(--s4)">Fala connosco</div>
        <div class="contact-channel">
          <div class="contact-channel-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1112.63 8 4 4 0 0116 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
          </div>
          <div>
            <div style="font-size:13px;font-weight:600">Instagram</div>
            <a href="#" style="font-size:12px;color:var(--text-3)">@noirlabel</a>
          </div>
        </div>
        <div class="contact-channel">
          <div class="contact-channel-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 01-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 01-2.88 2.5 2.89 2.89 0 01-2.89-2.89 2.89 2.89 0 012.89-2.89c.28 0 .54.04.79.1V9.01a6.33 6.33 0 00-.79-.05 6.34 6.34 0 00-6.34 6.34 6.34 6.34 0 006.34 6.34 6.34 6.34 0 006.33-6.34V8.77a8.16 8.16 0 004.77 1.52V6.82a4.85 4.85 0 01-1-.13z"/></svg>
          </div>
          <div>
            <div style="font-size:13px;font-weight:600">TikTok</div>
            <a href="#" style="font-size:12px;color:var(--text-3)">@noirlabel</a>
          </div>
        </div>
        <div class="contact-channel">
          <div class="contact-channel-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <div>
            <div style="font-size:13px;font-weight:600">Email</div>
            <a href="mailto:hello@noirlabel.pt" style="font-size:12px;color:var(--text-3)">hello@noirlabel.pt</a>
          </div>
        </div>
        <div class="contact-channel">
          <div class="contact-channel-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          </div>
          <div>
            <div style="font-size:13px;font-weight:600">WhatsApp</div>
            <a href="#" style="font-size:12px;color:var(--text-3)">+351 910 000 000</a>
          </div>
        </div>
      </div>

      <div style="margin-top:var(--s5);padding:var(--s5);background:var(--bg-2);border:1px solid var(--border);border-radius:var(--r4)" class="reveal">
        <div class="label" style="margin-bottom:var(--s3)">Horário de Suporte</div>
        <div style="font-size:13px;color:var(--text-3);line-height:2">
          Segunda–Sexta: 9h–18h<br>
          Sábado: 10h–14h<br>
          Domingo: Fechado
        </div>
        <div style="margin-top:var(--s4);font-size:12px;color:var(--text-4)">
          Resposta média em menos de 2 horas.
        </div>
      </div>
    </div>

    <!-- Form -->
    <div class="reveal">
      <h2 class="display-sm" style="margin-bottom:var(--s6)">Envia-nos uma mensagem</h2>
      <form id="contactForm">
        <div class="form-row" style="margin-bottom:var(--s4)">
          <div class="form-group">
            <label class="form-label">Nome</label>
            <input type="text" class="form-input" placeholder="João Silva" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" placeholder="nome@email.com" required>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:var(--s4)">
          <label class="form-label">Assunto</label>
          <select class="form-select">
            <option value="">Seleciona o assunto</option>
            <option>Encomenda / Rastreamento</option>
            <option>Devolução / Troca</option>
            <option>Produto / Tamanho</option>
            <option>Parceria / Colaboração</option>
            <option>Outro</option>
          </select>
        </div>
        <div class="form-group" style="margin-bottom:var(--s6)">
          <label class="form-label">Mensagem</label>
          <textarea class="form-textarea" placeholder="Como podemos ajudar?" required style="min-height:150px"></textarea>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Enviar Mensagem</button>
      </form>
    </div>
  </div>
</div>

<div id="footer"></div>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/cart.js"></script>
<script>
document.getElementById('contactForm')?.addEventListener('submit', e => {
  e.preventDefault();
  e.target.reset();
  showToast('Mensagem enviada! Respondemos em breve.', 'success');
});
</script>
</body>
</html>
