<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 330" width="280" height="330">
  <defs>
    <linearGradient id="whiteBody" x1="0%" y1="0%" x2="55%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF0F8"/>
    </linearGradient>
    <linearGradient id="whiteSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C8CCE0" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#C8CCE0" stop-opacity="0"/>
      <stop offset="65%" stop-color="#C8CCE0" stop-opacity="0"/>
      <stop offset="100%" stop-color="#C8CCE0" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="jerseyDropW" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <path id="jW" d="M88,14 C72,6 40,9 28,16 L4,58 L30,118 L68,100 L63,325 L217,325 L212,100 L250,118 L276,58 L252,16 C240,9 208,6 192,14 C178,40 162,48 140,48 C118,48 102,40 88,14Z"/>
    <clipPath id="jWClip">
      <use href="#jW"/>
    </clipPath>
    <polygon id="starW" points="0,-5.5 1.3,-1.8 5.2,-1.7 2.1,0.7 3.2,4.5 0,2.3 -3.2,4.5 -2.1,0.7 -5.2,-1.7 -1.3,-1.8"/>
  </defs>

  <!-- soft shadow layer -->
  <use href="#jW" fill="#000" opacity="0.18" transform="translate(6,12)"/>

  <!-- main body -->
  <use href="#jW" fill="url(#whiteBody)" filter="url(#jerseyDropW)"/>

  <!-- side shading for depth -->
  <use href="#jW" fill="url(#whiteSide)"/>

  <!-- blue collar band -->
  <path d="M88,14 C102,40 118,48 140,48 C162,48 178,40 192,14 L185,10 C172,32 157,42 140,42 C123,42 108,32 95,10Z" fill="#003893"/>

  <!-- blue sleeve trim — left sleeve edge -->
  <path d="M88,14 C72,6 40,9 28,16 L4,58 L30,118 L50,110 L32,62 L86,18Z"
        fill="#003893" opacity="0.18" clip-path="url(#jWClip)"/>

  <!-- blue sleeve trim — right sleeve edge -->
  <path d="M192,14 C208,6 240,9 252,16 L276,58 L250,118 L230,110 L248,62 L194,18Z"
        fill="#003893" opacity="0.18" clip-path="url(#jWClip)"/>

  <!-- shoulder seam hints -->
  <path d="M88,14 C72,6 40,9 28,16" fill="none" stroke="#003893" stroke-width="2" opacity="0.35"/>
  <path d="M192,14 C208,6 240,9 252,16" fill="none" stroke="#003893" stroke-width="2" opacity="0.35"/>

  <!-- sleeve seam lines -->
  <line x1="68" y1="100" x2="68" y2="190" stroke="#003893" stroke-width="1.5" opacity="0.3" clip-path="url(#jWClip)"/>
  <line x1="212" y1="100" x2="212" y2="190" stroke="#003893" stroke-width="1.5" opacity="0.3" clip-path="url(#jWClip)"/>

  <!-- blue horizontal band -->
  <rect x="63" y="192" width="154" height="22" clip-path="url(#jWClip)" fill="#003893"/>

  <!-- red stripe -->
  <rect x="63" y="214" width="154" height="10" clip-path="url(#jWClip)" fill="#CF1020"/>

  <!-- 10 stars in circle — center (115, 130), radius 22 -->
  <use href="#starW" transform="translate(115,108)" fill="#FFD100"/>
  <use href="#starW" transform="translate(127.9,112.2)" fill="#FFD100"/>
  <use href="#starW" transform="translate(135.9,123.2)" fill="#FFD100"/>
  <use href="#starW" transform="translate(135.9,136.8)" fill="#FFD100"/>
  <use href="#starW" transform="translate(127.9,147.8)" fill="#FFD100"/>
  <use href="#starW" transform="translate(115,152)" fill="#FFD100"/>
  <use href="#starW" transform="translate(102.1,147.8)" fill="#FFD100"/>
  <use href="#starW" transform="translate(94.1,136.8)" fill="#FFD100"/>
  <use href="#starW" transform="translate(94.1,123.2)" fill="#FFD100"/>
  <use href="#starW" transform="translate(102.1,112.2)" fill="#FFD100"/>

  <!-- jersey outline -->
  <use href="#jW" fill="none" stroke="#C8CCE0" stroke-width="1"/>
</svg>
